<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>亲情账单</title>
<style>
  :root{--bg:#EDEDED;--paper:#FFFFFF;--ink:#1B1B1B;--mute:#7A7A7A;--line:#DCDCDC;--red:#E0502A;--green:#07C160;
    --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;--sans:"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#D6D6D6;font-family:var(--sans);color:var(--ink);display:flex;justify-content:center;padding:24px}
  .card{width:390px;min-height:844px;background:var(--bg);padding:34px 24px 28px;display:flex;flex-direction:column;gap:18px}
  .paper{background:var(--paper);border-radius:10px;padding:22px 20px;position:relative}
  .paper::before,.paper::after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle,var(--bg) 4px,transparent 4.5px) 0 0/16px 8px repeat-x}
  .paper::before{top:-4px}.paper::after{bottom:-4px;transform:rotate(180deg)}
  .eyebrow{font-size:11px;letter-spacing:.24em;color:var(--mute);text-align:center}
  h1{font-family:var(--serif);font-size:24px;font-weight:600;text-align:center;margin-top:6px}
  .period{text-align:center;font-size:12px;color:var(--mute);margin-top:4px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
  .r{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .r .v{font-family:var(--serif);font-size:20px;font-weight:600}
  .r.total{border-bottom:0;padding-top:16px}
  .r.total span:first-child{font-size:13px;color:var(--mute)}
  .r.total .v{font-size:16px;line-height:1.5;text-align:right;max-width:70%}
  .stamp{display:flex;justify-content:center;margin:6px 0 2px}
  .stamp span{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--red);border:2.5px solid var(--red);border-radius:10px;padding:2px 18px;transform:rotate(-6deg);opacity:.9}
  .types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .types div{background:var(--paper);border-radius:10px;padding:12px 14px}
  .types .k{font-size:11px;color:var(--mute)}
  .types .t{font-family:var(--serif);font-size:17px;font-weight:600;margin-top:2px}
  .idx{background:var(--paper);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:13px}
  .idx div{display:grid;grid-template-columns:100px 30px 1fr;gap:10px;align-items:center;white-space:nowrap}
  .idx b{font-family:var(--serif);font-size:16px;text-align:right}
  .idx i{display:block;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .idx i::after{content:"";display:block;height:100%;background:var(--green);width:var(--w)}
  .cta{margin-top:auto;font-family:var(--serif);font-size:16px;font-weight:600;text-align:center;line-height:1.6}
  .foot{font-size:10px;color:var(--mute);text-align:center;line-height:1.6}
</style>
</head>
<body>
<article class="card">
  <div class="paper">
    <div class="eyebrow">妈妈的消息</div>
    <h1>亲情账单</h1>
    <div class="period">2026-03-01 至 2026-08-28 · 181 天 · 共 294 条（她 192 / 你 102）</div>
    <div class="r"><span>她发给你</span><span class="v">192 条</span></div>
    <div class="r"><span>你回她</span><span class="v">102 条</span></div>
    <div class="r"><span>你的"嗯 / 好 / 知道了"</span><span class="v">52 次</span></div>
    <div class="r"><span>她发了你没回</span><span class="v">59 次</span></div>
    <div class="r"><span>你上一次主动开口</span><span class="v">7 天前</span></div>
    <div class="r total"><span>结余</span><span class="v">欠 59 条回复、1 个电话</span></div>
    <div class="stamp"><span>欠一个电话</span></div>
  </div>
  <div class="types">
    <div><div class="k">她</div><div class="t">三餐监督型</div></div>
    <div><div class="k">你</div><div class="t">嗯哦好选手</div></div>
  </div>
  <div class="idx">
    <div><span>💛 牵挂指数</span><b>57</b><i style="--w:57%"></i></div>
    <div><span>🧊 嗯哦好指数</span><b>42</b><i style="--w:42%"></i></div>
    <div><span>🕰️ 不计较指数</span><b>92</b><i style="--w:92%"></i></div>
  </div>
  <p class="cta">今晚 8 点，打个电话</p>
  <p class="foot">这是一份统计，不是评判 · 数据在本地，没有上传 · 妈妈的消息</p>
</article>
</body>
</html>
